<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf8ff">

      border: 1px solid #d8effb;
    }

    .header {
      position: relative;
      text-align: center;
      padding: 28px 20px 25px;
      background: linear-gradient(135deg, #e4f7ff, #ffffff, #dff4ff);
      border-bottom: 1px solid #e2f2fa;
    }

    .logo-icon {

    }

    .tagline {

      font-weight: bold;
      letter-spacing: 0.4px;
    }

    .content {
      padding: 25px 25px 18px;
    }

    h1 {
      font-size: clamp(27px, 5vw, 36px);
      line-height: 1.2;
      margin-bottom: 12px;
      color: #173553;
      letter-spacing: -1px;
    }

    h1 span {
      color: #079fcb;
    }

    .subtitle {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.4;
      color: #405b76;
      margin-bottom: 14px;
    }

    .intro {
      font-size: 14px;
      color: #53677b;
      margin-bottom: 25px;
    }

      gap: 16px;
      align-items: flex-start;
      padding: 22px 18px;
      margin-bottom: 14px;
      border: 1px solid #e7f2f8;
      border-radius: 17px;
      background: linear-gradient(120deg, #ffffff, #fbfeff);
      box-shadow: 0 5px 15px rgba(39, 118, 157, 0.07);
    }

    .step-icon {
      flex: 0 0 55px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #e1f5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-top: 3px;
    }

    .step-body {
      flex: 1;
      min-width: 0;
    }

    .step-title {
      font-size: 20px;
      line-height: 1.35;
      margin-bottom: 10px;
      color: #173553;
      font-weight: 800;
    }
