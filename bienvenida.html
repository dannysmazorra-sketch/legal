<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenido a Imagux</title>
  <link rel="icon" type="image/jpeg" href="/photo_5357381075497330302_y.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a52;
    --blue:#0a8fd8;
    --blue-soft:#e3f2fc;
    --orange:#f7a823;
    --text:#44566f;
    --bg:#eaf4fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',Arial,sans-serif;
    background:linear-gradient(180deg,#f3f9fe 0%,#e4f1fb 100%);
    color:var(--text);
    min-height:100vh;
    padding:32px 16px;
    display:flex;justify-content:center;align-items:flex-start;
  }
  .card{
    width:100%;max-width:830px;background:#fff;border-radius:22px;
    box-shadow:0 20px 60px rgba(10,100,180,.15);
    overflow:hidden;position:relative;
  }

  /* Header */
  .header{
    position:relative;background:linear-gradient(180deg,#f2f9ff,#fbfdff);
    padding:28px 20px 18px;text-align:center;overflow:hidden;
  }
  .header .corner{position:absolute;top:0;left:0;width:170px;height:90px}
  .header .pill{
    position:absolute;right:-30px;top:40px;width:150px;height:60px;
    background:linear-gradient(135deg,#cfe9fb,#e6f4fd);border-radius:40px;transform:rotate(-45deg);
  }
  .logo{display:inline-flex;flex-direction:column;align-items:center;position:relative;z-index:2}
  .logo svg{width:84px;height:auto}
  .logo .name{font-size:54px;font-weight:500;color:var(--blue);letter-spacing:1px;line-height:1;margin-top:-4px}
  .logo .tag{font-size:10.5px;font-weight:700;color:var(--orange);margin-top:4px}

  /* Intro */
  .intro{
    padding:34px 60px 20px;display:flex;gap:20px;align-items:center;justify-content:space-between;
  }
  .intro-text{flex:1}
  .intro h1{font-size:40px;font-weight:800;color:var(--navy);line-height:1.1;margin-bottom:14px}
  .intro h1 span{color:var(--blue)}
  .intro h2{font-size:22px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:14px}
  .intro p{font-size:15.5px;line-height:1.65}
  .robot{width:220px;flex-shrink:0}

  /* Steps */
  .steps{padding:10px 32px 10px;display:flex;flex-direction:column;gap:18px}
  .step{
    background:#fff;border-radius:18px;padding:28px 26px;
    box-shadow:0 6px 24px rgba(10,100,180,.08);
    display:flex;align-items:center;gap:22px;
  }
  .icon{
    width:84px;height:84px;border-radius:50%;background:var(--blue-soft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .icon svg{width:44px;height:44px}
  .step-body{
    flex:1;border-left:2px solid var(--blue-soft);padding-left:22px;
  }
  .step-title{font-size:25px;font-weight:700;color:var(--navy);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .step-title .num{font-size:44px;font-weight:800;color:var(--orange);line-height:1}
  .step-title .dot{color:var(--blue);font-weight:700}
  .step-body p{font-size:15px;line-height:1.6;margin-top:10px}

  .btn{
    display:inline-flex;align-items:center;gap:10px;margin-top:16px;
    background:linear-gradient(180deg,#14a0e6,#0888d4);color:#fff;text-decoration:none;
    font-weight:700;font-size:14.5px;letter-spacing:.8px;text-transform:uppercase;
    padding:15px 62px;border-radius:30px;box-shadow:0 8px 18px rgba(8,136,212,.35);
    transition:transform .15s,box-shadow .15s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(8,136,212,.45)}

  .qr-box{
    flex-shrink:0;width:200px;border:2px dashed #52b6ec;border-radius:12px;
    padding:18px 12px;text-align:center;text-decoration:none;color:var(--navy);
    background:#f7fbff;transition:background .15s,transform .15s;display:block;
  }
  .qr-box:hover{background:#e9f5fd;transform:translateY(-2px)}
  .qr-box svg{width:82px;height:82px}
  .qr-box strong{display:block;font-size:13px;margin-top:10px;font-weight:800;letter-spacing:.3px}
  .qr-box small{display:block;font-size:11px;margin-top:3px;color:var(--text)}
  .qr-box .qr-btn{
    display:inline-block;margin-top:10px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;
    padding:8px 16px;border-radius:20px;letter-spacing:.5px;
  }

  /* Thanks */
  .thanks{
    margin:18px 32px 24px;background:linear-gradient(90deg,#eaf4fc,#f4f9fe);border-radius:16px;
    padding:22px 26px;display:flex;align-items:center;gap:22px;position:relative;
  }
  .heart{
    width:62px;height:62px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .heart svg{width:30px;height:30px}
  .thanks-text{border-left:2px solid #d3e7f7;padding-left:20px}
  .thanks-text strong{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}
  .thanks-text span{font-size:15px;line-height:1.5}
  .sparks{margin-left:auto;width:60px}

  /* Footer */
  .footer{
    background:linear-gradient(135deg,#102c55,#1a4378);color:#fff;text-align:center;
    padding:28px 20px 30px;position:relative;overflow:hidden;
  }
  .footer .brand{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
  .footer .brand .n{font-size:34px;font-weight:400;color:#5fc3f5;letter-spacing:1px}
  .footer .brand .sep{width:1px;height:22px;background:#5fc3f5}
  .footer .brand .t{font-size:13px;font-weight:700;color:var(--orange)}
  .contact{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:18px;flex-wrap:wrap;font-size:14.5px}
  .contact a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
  .contact a:hover{text-decoration:underline}
  .contact svg{width:22px;height:22px}
  .contact .vsep{width:1px;height:24px;background:#3b6aa3}
  .bars{margin-top:18px;display:flex;justify-content:center;gap:10px}
  .bars i{display:block;width:50px;height:3px;border-radius:2px;background:var(--blue)}
  .bars i+i{background:var(--orange)}
  .footer .fc1{position:absolute;left:0;bottom:0;width:100px}
  .footer .fc2{position:absolute;right:0;bottom:0;width:150px}

  /* Responsive */
  @media (max-width:680px){
    body{padding:14px 8px}
    .intro{flex-direction:column;padding:26px 24px 10px;text-align:left}
    .intro h1{font-size:32px}
    .robot{width:170px;align-self:center}
    .steps{padding:10px 14px}
    .step{flex-direction:column;align-items:flex-start;padding:22px 20px}
    .step-body{border-left:none;padding-left:0;width:100%}
    .qr-box{width:100%}
    .btn{padding:15px 30px;width:100%;justify-content:center}
    .thanks{margin:16px 14px 20px;flex-wrap:wrap}
    .sparks{display:none}
    .contact .vsep{display:none}
    .logo .name
